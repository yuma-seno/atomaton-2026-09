          path: .atomaton-pull-request
      - name: Setup Bun
        with:
          bun-version: latest
        uses: oven-sh/setup-bun@v2
      - name: Run this check's commands
        shell: bash
        env:
          ATOMATON_SECRET_0: ${{ secrets[matrix.secrets[0]] }}
          ATOMATON_SECRET_1: ${{ secrets[matrix.secrets[1]] }}
          ATOMATON_SECRET_2: ${{ secrets[matrix.secrets[2]] }}
          ATOMATON_SECRET_3: ${{ secrets[matrix.secrets[3]] }}
          ATOMATON_SECRET_4: ${{ secrets[matrix.secrets[4]] }}
          ATOMATON_SECRET_5: ${{ secrets[matrix.secrets[5]] }}
          ATOMATON_SECRET_6: ${{ secrets[matrix.secrets[6]] }}
          ATOMATON_SECRET_7: ${{ secrets[matrix.secrets[7]] }}
          ATOMATON_SECRET_8: ${{ secrets[matrix.secrets[8]] }}
