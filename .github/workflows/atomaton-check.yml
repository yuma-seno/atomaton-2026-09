          echo "$ATOMATON_CHECK_COMMANDS" | jq -r ".[]" | while IFS= read -r command; do
            echo "::group::$command"
            if ! bash -c "$command"; then
              echo "::endgroup::"
              echo "::error::${{ matrix.name }}: $command"
              exit 1
            fi
            echo "::endgroup::"
          done
  atomaton-check:
    needs:
      - pull-request-checks
      - default-branch-checks
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
