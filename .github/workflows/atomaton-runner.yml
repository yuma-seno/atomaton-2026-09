jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: atomaton-${{ inputs.type }}-${{ inputs.number }}
      cancel-in-progress: false
    permissions:
      actions: write
      issues: write
      pull-requests: write
      contents: write
      checks: read
    steps:
      - name: Validate workflow inputs
        shell: bash
        env:
          AGENT: ${{ inputs.agent }}
          NUMBER: ${{ inputs.number }}
          TYPE: ${{ inputs.type }}
          SESSION_MODE: ${{ inputs.session_mode }}
          ATOMA_VERSION: ${{ inputs.atoma_version }}
          NOTIFY: ${{ inputs.notify }}
        run: |
          reject() {
            echo "::error::atomaton-runner received an invalid \`$1\` input: '$2'. $3"
            exit 1
          }

          [[ "$AGENT" =~ ^[a-z][a-z0-9-]*$ ]] ||
            reject agent "$AGENT" "Expected a bare lowercase agent name, e.g. 'engineer'."
          [[ "$NUMBER" =~ ^[0-9]+$ ]] ||
            reject number "$NUMBER" "Expected an issue or pull request number."
          [[ "$TYPE" == "issue" || "$TYPE" == "pr" ]] ||
            reject type "$TYPE" "Expected 'issue' or 'pr'."
          [[ "$SESSION_MODE" == "continue" || "$SESSION_MODE" == "recover" ]] ||
            reject session_mode "$SESSION_MODE" "Expected 'continue' or 'recover'."
          # 'source' builds from a checkout; anything else is fetched as a release asset
          # and interpolated into a download URL, so keep it to a tag-shaped string.
          [[ "$ATOMA_VERSION" =~ ^(source|latest|v[0-9A-Za-z._-]+)$ ]] ||
            reject atoma_version "$ATOMA_VERSION" "Expected 'source', 'latest', or a release tag like 'v0.1.7'."
          # May be empty: a run with nobody to notify is normal.
          [[ "$NOTIFY" =~ ^[A-Za-z0-9-]*$ ]] ||
            reject notify "$NOTIFY" "Expected a GitHub login, or empty."

          echo "Inputs validated: ${TYPE} #${NUMBER}, agent=${AGENT}, session_mode=${SESSION_MODE}"
      - name: Record when the agent must be finished
        id: deadline
        shell: bash
        run: |
          DEADLINE=$(( $(date +%s) + 3300 ))
          echo "at=${DEADLINE}" >> "$GITHUB_OUTPUT"
          echo "the agent must be finished by $(date -u -d @${DEADLINE} +%H:%M:%SZ)"
      - name: Make a place for this run's own files
        shell: bash
        run: |
          mkdir -p "${RUNNER_TEMP}/atomaton-run"
          echo "this run's files: ${RUNNER_TEMP}/atomaton-run"
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.type == 'pr' && format('refs/pull/{0}/head', inputs.number) || '' }}
      - name: Checkout the delivery machinery from the default branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: atomaton-machinery
      - name: Move the machinery out of the work tree
        shell: bash
        run: |
          rm -rf "${RUNNER_TEMP}/atomaton-machinery"
          mv "atomaton-machinery" "${RUNNER_TEMP}/atomaton-machinery"
          echo "ATOMATON_MACHINERY_ROOT=${RUNNER_TEMP}/atomaton-machinery" >> "$GITHUB_ENV"
          echo "machinery moved to ${RUNNER_TEMP}/atomaton-machinery; the work tree holds only the repository"
      - name: Setup Bun
        with:
          bun-version: latest
        uses: oven-sh/setup-bun@v2
      - name: Resolve the issue's branch
        id: issue-branch
        if: inputs.type == 'issue'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/resolve_issue_branch.ts" --repo "${{ github.repository }}" --issue "${{ inputs.number }}"
      - name: Check out the branch this run starts from
        if: inputs.type == 'issue'
        shell: bash
        env:
          BRANCH_NAME: ${{ steps.issue-branch.outputs.branch }}
        run: |
          if [ -z "${BRANCH_NAME}" ]; then
            BRANCH_NAME=$(bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/get_config_value.ts" "base_branch" "")
            [ -n "${BRANCH_NAME}" ] || exit 0
          else
            echo "BRANCH=${BRANCH_NAME}" >> $GITHUB_ENV
          fi
          git fetch origin "refs/heads/${BRANCH_NAME}:refs/remotes/origin/${BRANCH_NAME}"
          git checkout -B "${BRANCH_NAME}" "refs/remotes/origin/${BRANCH_NAME}"
      - name: Resolve the pull request's head branch
        id: pr-branch
        if: inputs.type == 'pr'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/resolve_pr_branch.ts" --repo "${{ github.repository }}" --number "${{ inputs.number }}"
      - name: Check out the pull request's head branch
        if: inputs.type == 'pr'
        shell: bash
        env:
          BRANCH_NAME: ${{ steps.pr-branch.outputs.branch }}
        run: |
          if [ -z "${BRANCH_NAME}" ]; then
            echo "no pull request head branch to check out; this run stays on the detached checkout"
            exit 0
          fi

          # The remote-tracking ref as well, so a later `sync_branch` compares against
          # something current rather than against nothing.
          if ! git fetch origin "refs/heads/${BRANCH_NAME}:refs/remotes/origin/${BRANCH_NAME}"; then
            echo "::warning::could not fetch ${BRANCH_NAME} from origin; this run stays on the detached checkout"
            exit 0
          fi

          # `HEAD`, and deliberately not `$GITHUB_SHA`. `actions/checkout` checked
          # `refs/pull/N/head` out detached, so HEAD is the pull request's own head
          # commit -- that much is certain. `$GITHUB_SHA` is the dispatch ref's tip
          # instead, and this run is dispatched by `gh workflow run` with no `--ref`, so
          # that is the DEFAULT branch: naming it here would check the run out onto the
          # default branch and commit its tree on top of the pull request -- measured, the
          # working tree came back as the base commit with the pull request's own change
          # gone. In a checkout that holds only the pull request it is not even present,
          # and the checkout fails outright. Re-labelling HEAD is the whole operation: the
          # same commit, now with the branch name the pull request is already from.
          if ! git checkout -B "${BRANCH_NAME}" HEAD; then
            echo "::warning::could not check out ${BRANCH_NAME}; this run stays on the detached checkout"
            exit 0
          fi
          echo "BRANCH=${BRANCH_NAME}" >> $GITHUB_ENV
          echo "on the pull request's head branch: ${BRANCH_NAME}"
      - name: Cache MCP server package downloads
        with:
          path: ~/.npm
          key: mcp-npm-${{ hashFiles('atomaton-machinery/.github/atomaton-runtime/tools/packages.json', 'atomaton-machinery/.github/atomaton/config.yaml') }}
          restore-keys: mcp-npm-
        uses: actions/cache@v4
      - name: Install MCP server packages
        shell: bash
        run: |
          # Two lists: what the shipped servers need, and what a project declared
          # for a server of its own in `tools.packages`. Installed as one set, because a
          # runner does not care which half asked.
          MCP_PKGS_FILE="${ATOMATON_MACHINERY_ROOT}/.github/atomaton-runtime/tools/packages.json"
          PROJECT_CONFIG="${ATOMATON_MACHINERY_ROOT}/.github/atomaton/config.yaml"
          if [ ! -f "$MCP_PKGS_FILE" ]; then
            echo "::error::$MCP_PKGS_FILE is missing. The shipped tool servers cannot be installed."
            exit 1
          fi

          # Merged here rather than in a script, so the jq below reads one shape.
          MERGED_PKGS="${RUNNER_TEMP}/atomaton-run/packages.json"
          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/merge_tool_packages.ts" --shipped "$MCP_PKGS_FILE" --config "$PROJECT_CONFIG" --out "$MERGED_PKGS"
          MCP_PKGS_FILE="$MERGED_PKGS"

          # Executables a tool server is started by name, installed globally.
          NPM_PKGS=$(jq -r '.npm[]? // empty' "$MCP_PKGS_FILE" 2>/dev/null || true)
          if [ -n "$NPM_PKGS" ]; then
            echo "Installing npm MCP packages: $NPM_PKGS"
            for pkg in $NPM_PKGS; do
              npm install -g "$pkg"
            done
            # Put the global bin directory on PATH so those names resolve.
            NPM_BIN=$(npm prefix -g)/bin
            echo "$NPM_BIN" >> "$GITHUB_PATH"
            echo "Added npm global bin to PATH: $NPM_BIN"
          fi

          # Packages a bundled script imports rather than spawns.
          #
          # The npm list above installs executables globally, which is right for a server
          # started by name. This list is for libraries a tool server imports; they are
          # excluded from the bundle because they reach native code a JavaScript bundler
          # cannot carry, so they have to be resolvable at run time.
          #
          # Installed NEXT TO THE MACHINERY, not in the work tree. Module resolution walks
          # up from the importing file looking for `node_modules`, and the servers now live
          # in `$RUNNER_TEMP/atomaton-machinery` -- so the walk goes to `$RUNNER_TEMP` and stops
          # at the root, never reaching the workspace. This was measured, not reasoned about:
          # moving the machinery out killed the search server with
          #
          #   Failed to initialize MCP server 'search': MCP server closed connection
          #   error: Unexpected while resolving package 'onnxruntime-common'
          #
          # and atoma treats a server that will not initialise as fatal, so one missing
          # library took the whole run down.
          #
          # Separate from the project's own `node_modules` is the better arrangement anyway.
          # A project whose `environment.setup_commands` install a conflicting version of one
          # of these would otherwise break a tool server, and nothing would connect the two.
          BUN_PKGS=$(jq -r '.bun[]? // empty' "$MCP_PKGS_FILE" 2>/dev/null || true)
          if [ -n "$BUN_PKGS" ]; then
            echo "Installing bun MCP libraries: $BUN_PKGS"
            # A manifest of its own, so `bun add` has somewhere to work and does not read a
            # project's. `--no-save` still applies; this only gives it a directory to own.
            if [ ! -f "${RUNNER_TEMP}/package.json" ]; then
              echo '{"name":"atomaton-mcp-libraries","private":true}' > "${RUNNER_TEMP}/package.json"
            fi
            (cd "${RUNNER_TEMP}" && bun add --no-save $BUN_PKGS)
            echo "MCP libraries installed at ${RUNNER_TEMP}/node_modules, beside the machinery"
          fi

          # Python packages, for a tool server that ships as one.
          PIP_PKGS=$(jq -r '.pip[]? // empty' "$MCP_PKGS_FILE" 2>/dev/null || true)
          if [ -n "$PIP_PKGS" ]; then
            echo "Installing pip MCP packages: $PIP_PKGS"
            for pkg in $PIP_PKGS; do
              pip install "$pkg"
            done
          fi
      - name: Read which reranker to cache
        id: reranker
        shell: bash
        run: |
          MODEL=$(bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/get_config_value.ts" "tools.servers.search.settings.reranker_model" "onnx-community/bge-reranker-v2-m3-ONNX")
          echo "reranker: ${MODEL}"
          echo "cache_key=atomaton-reranker-$(echo "${MODEL}" | tr '/:' '--')" >> "$GITHUB_OUTPUT"
      - name: Cache the reranker model
        with:
          path: ${{ runner.temp }}/atomaton-tool-cache/atomaton-transformers
          key: ${{ steps.reranker.outputs.cache_key }}
          restore-keys: atomaton-reranker-
        uses: actions/cache@v4
      - name: Make tool hooks executable
        shell: bash
        run: |
          if [ -d "${ATOMATON_MACHINERY_ROOT}/.github/atomaton-runtime/tools/hooks" ]; then
            find "${ATOMATON_MACHINERY_ROOT}/.github/atomaton-runtime/tools/hooks" -name '*.ts' -exec chmod +x {} +
          fi
      - name: 'Checkout Atoma source (for atoma_version: source)'
        uses: actions/checkout@v4
        with:
          repository: yuma-seno/atoma
          path: atoma-src
        if: inputs.atoma_version == 'source'
      - name: Install Atoma CLI
        shell: bash
        run: |
          VERSION="${{ inputs.atoma_version }}"
          if [ "$VERSION" = "source" ]; then
            echo "Building Atoma from source (atoma-src/) ..."
            cargo install --path atoma-src --force --locked
          elif [ "$VERSION" = "latest" ]; then
            URL="https://github.com/yuma-seno/atoma/releases/latest/download/atoma-linux-x86_64"
            echo "Downloading Atoma ${VERSION} ..."
            curl -fsSL "$URL" -o /usr/local/bin/atoma
            chmod +x /usr/local/bin/atoma
          else
            URL="https://github.com/yuma-seno/atoma/releases/download/${VERSION}/atoma-linux-x86_64"
            echo "Downloading Atoma ${VERSION} ..."
            curl -fsSL "$URL" -o /usr/local/bin/atoma
            chmod +x /usr/local/bin/atoma
          fi
          atoma --version
      - name: Check the resolved provider has a credential
        shell: bash
        env:
          OPENAI_API_KEY_PRESENT: ${{ secrets.OPENAI_API_KEY != '' }}
          OPENROUTER_API_KEY_PRESENT: ${{ secrets.OPENROUTER_API_KEY != '' }}
          ORCAROUTER_API_KEY_PRESENT: ${{ secrets.ORCAROUTER_API_KEY != '' }}
          ANTHROPIC_API_KEY_PRESENT: ${{ secrets.ANTHROPIC_API_KEY != '' }}
          ATOMA_COPILOT_TOKEN_PRESENT: ${{ secrets.ATOMA_COPILOT_TOKEN != '' }}
          AGENT: ${{ inputs.agent }}
          ATOMA_PROVIDER_IN: ${{ vars.ATOMA_PROVIDER }}
        run: |
          # Which of this run's credentials exist, BY NAME. Every `*_PRESENT` value
          # below is a boolean GitHub computed when this step started; no secret's value is
          # in this shell.
          PRESENT=""
          for name in OPENAI_API_KEY OPENROUTER_API_KEY ORCAROUTER_API_KEY ANTHROPIC_API_KEY ATOMA_COPILOT_TOKEN; do
            eval "present=\${${name}_PRESENT:-}"
            if [ "$present" = "true" ]; then
              PRESENT="${PRESENT:+${PRESENT},}$name"
            fi
          done

          # Promoted only when non-empty, the rule the agent step uses, so the two cannot
          # disagree about which provider this run is about to use.
          if [ -n "${ATOMA_PROVIDER_IN:-}" ]; then
            export ATOMA_PROVIDER="${ATOMA_PROVIDER_IN}"
          fi

          # The machinery's copy of the definition, not the checkout's: on a pull request
          # run the checkout IS the pull request, and the file that decides the provider must
          # not be one it supplied. See `script-call.ts`.
          AGENT_DEF="${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton/agent-definitions/${AGENT}.md"

          # The core resolves the provider and writes the message; this reads an exit code
          # and repeats none of the reasoning. The flag is passed even when PRESENT is empty
          # -- an empty list is a caller saying "none are set", which is a state the core is
          # able to answer, and the one whose answer names every credential that would work.
          OUT=$(mktemp)
          STATUS=0
          atoma validate --agent-def "$AGENT_DEF" --credentials-present "$PRESENT" > "$OUT" 2>&1 || STATUS=$?

          # Nothing to say. A run whose provider is satisfied stays as quiet as it was before
          # this step existed: `atoma validate` also prints its ordinary "parsed", "known
          # provider" lines, and those are not worth a line in every run's log.
          if [ "$STATUS" -eq 0 ]; then
            rm -f "$OUT"
            exit 0
          fi

          # 127 is "there is no atoma to ask"; 2 is "this atoma did not understand the
          # question" -- a binary older than the flag, or a later one that renamed it.
          # Neither is an answer about a credential, so neither may stop the run. What
          # follows is the core's own provider error at the first inference, and this line is
          # what connects it to the reason it was not caught here.
          if [ "$STATUS" -eq 127 ] || [ "$STATUS" -eq 2 ]; then
            echo "::warning::could not ask atoma whether this run's provider has a credential (exit $STATUS). Continuing; a missing credential will surface as a provider error when the agent starts."
            rm -f "$OUT"
            exit 0
          fi

          # The core refused. It refuses for one of two reasons, and only the core can tell
          # them apart -- so ask it the question that has no credential half. A definition
          # that does not validate is a defect with its own message, and reporting it as a
          # missing secret would send somebody to add a secret that changes nothing.
          if ! atoma validate --agent-def "$AGENT_DEF" > /dev/null 2>&1; then
            echo "::warning::the agent definition at $AGENT_DEF does not validate, so whether this run's provider has a credential could not be checked. What follows is the definition's failure, not a missing secret:"
            cat "$OUT" >&2
            rm -f "$OUT"
            exit 0
          fi

          cat "$OUT" >&2

          # Which credential names the core's own message mentions. Matching this run's list
          # against that output is not parsing prose: if exactly one name appears, that is
          # the credential the provider needs, and naming it in the annotation is what puts
          # it in the summary rather than only in the log. Zero or several appearing leaves
          # the output to speak for itself -- "no credential is set" lists all of them, and
          # "more than one is set" is not a missing secret at all.
          MISSING=""
          MATCHES=0
          for name in OPENAI_API_KEY OPENROUTER_API_KEY ORCAROUTER_API_KEY ANTHROPIC_API_KEY ATOMA_COPILOT_TOKEN; do
            if grep -q "$name" "$OUT"; then
              MISSING="$name"
              MATCHES=$((MATCHES + 1))
            fi
          done
          rm -f "$OUT"

          if [ "$MATCHES" -eq 1 ]; then
            echo "::error::this run's provider authenticates with $MISSING, which this repository does not have. Add it under Settings > Secrets and variables > Actions, then dispatch the run again. Stopped before the environment was built, so no runner was spent on it."
          else
            echo "::error::this run's provider could not be resolved with the credentials this repository has. The atoma output above says why, and names what is involved. Stopped before the environment was built, so no runner was spent on it."
          fi
          exit 1
      - name: Run configured environment setup
        shell: bash
        run: |
          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/run_environment_setup.ts"
      - name: Configure git identity
        shell: bash
        run: |
          git config user.name "atomaton-${{ inputs.agent }}"
          git config user.email "atomaton-${{ inputs.agent }}@users.noreply.github.com"
      - name: Resolve effective notify login
        id: notify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY: ${{ inputs.notify }}
          NUMBER: ${{ inputs.number }}
        run: |
          EFFECTIVE="$NOTIFY"
          if [ -z "$EFFECTIVE" ]; then
            EFFECTIVE=$(bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/resolve_notify.ts" --repo "${GITHUB_REPOSITORY}" --number "${NUMBER}")
            [ -n "$EFFECTIVE" ] && echo "Resolved notify fallback: ${EFFECTIVE}"
          fi
          echo "notify=${EFFECTIVE}" >> "$GITHUB_OUTPUT"
      - name: Fetch GitHub events
        id: fetch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/fetch_events.ts" --type "${{ inputs.type }}" --number "${{ inputs.number }}" --out "${RUNNER_TEMP}/atomaton-run/events.json"
      - name: Restore agent session from atomaton-data
        id: restore-session
        shell: bash
        run: |
          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/restore_agent_session.ts" --type "${{ steps.fetch.outputs.resolved_type }}" --number "${{ steps.fetch.outputs.resolved_number }}" --agent "${{ inputs.agent }}" --out "${RUNNER_TEMP}/atomaton-run/session.json" --session-mode "${{ inputs.session_mode }}"
      - name: Restore the agent's workspace
        id: workspace
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/restore_workspace.ts" --type "${{ inputs.type }}" --number "${{ inputs.number }}" --dest "/tmp/atomaton-workspace" --repo "${{ github.repository }}"
      - name: Merge GitHub context into session
        id: context
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/reconcile_github_session.ts" --events "${RUNNER_TEMP}/atomaton-run/events.json" --agent-name "${{ inputs.agent }}" --agent-def "${ATOMATON_MACHINERY_ROOT}/.github/atomaton/agent-definitions/${{ inputs.agent }}.md" --session "${RUNNER_TEMP}/atomaton-run/session.json" --out "${RUNNER_TEMP}/atomaton-run/session.json"
      - name: Add atomaton/in-progress label
        if: steps.context.outputs.new_event_count != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.number }}
        run: |
          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/manage_in_progress_label.ts" --action "add" --number "${NUMBER}"
      - name: Post reviewer-start comment
        if: steps.context.outputs.new_event_count != '0' && inputs.agent == 'reviewer' && inputs.type == 'pr'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.number }}
        run: |
          gh issue comment "$NUMBER" --body "<!-- atomaton:llm-context=exclude -->
          Atomaton: reviewer starting review."
      - name: Put the tool servers on a user without sudo
        shell: bash
        run: |
          sudo useradd -M -U -s /usr/sbin/nologin "atomaton-tools" 2>/dev/null || true
          id "atomaton-tools"

          # Traverse-only down to the workspace, walked rather than hardcoded: the path
          # between HOME and the workspace is the runner's business, not ours.
          DIR="$GITHUB_WORKSPACE"
          while [ "$DIR" != "/" ]; do
            DIR=$(dirname "$DIR")
            # Stop before "/" itself, and before anything world-traversable already: a
            # self-hosted runner's workspace is often nowhere near $HOME, and walking to the
            # root would put an ACL on "/".
            [ "$DIR" = "/" ] && break
            sudo setfacl -m "u:atomaton-tools:x" "$DIR"
            [ "$DIR" = "$HOME" ] && break
          done

          # Full access inside the tree, and as a default so later files inherit it. `X`
          # rather than `x`: execute on directories, not on every file.
          sudo setfacl -R -m "u:atomaton-tools:rwX" "$GITHUB_WORKSPACE"
          sudo setfacl -R -d -m "u:atomaton-tools:rwX" "$GITHUB_WORKSPACE"
          sudo setfacl -R -d -m "u:$(id -un):rwX" "$GITHUB_WORKSPACE"

          # Somewhere real for the caches, since $HOME is not writable by this user.
          sudo install -d -o "atomaton-tools" -m 0700 "${RUNNER_TEMP}/atomaton-tool-cache"

          # And both ways round, recursively, for the same reason the run directory below
          # needs it.
          #
          # This directory is no longer only the tool user's: actions/cache restored the
          # reranker into it as the RUNNER, moments ago, and will read it back as the runner
          # after the agent has finished. Without these the two users have half of it each --
          # the restored weights unwritable by the server that loads them, which is the
          # exactly, and the downloaded weights unreadable by the save that should keep them.
          #
          # -R as well as -d: a default ACL only reaches files created after it is set, and
          # the restore already wrote several hundred of them.
          sudo setfacl -R -m "u:atomaton-tools:rwX" "${RUNNER_TEMP}/atomaton-tool-cache"
          sudo setfacl -R -d -m "u:atomaton-tools:rwX" "${RUNNER_TEMP}/atomaton-tool-cache"
          sudo setfacl -R -m "u:$(id -un):rwX" "${RUNNER_TEMP}/atomaton-tool-cache"
          sudo setfacl -R -d -m "u:$(id -un):rwX" "${RUNNER_TEMP}/atomaton-tool-cache"

          # The run's own directory, handed to the tool user now that it exists. `atoma run`
          # writes the session as that user while the runner wrote it moments before, and the
          # runner reads it back afterwards -- so both need access, to files that do not exist
          # yet. Hence the default ACLs: whatever either one creates in here, the other can
          # read and write.
          # `-R` as well as `-d`, and the difference matters here more than it does for the
          # work tree. A default ACL applies to files created AFTER it is set, and three
          # steps have already written into this directory by now -- the session among them,
          # which `atoma run` is about to open for writing as the tool user. Without the
          # recursive pass that file keeps the mode `mkdir` gave it and the write fails.
          sudo setfacl -R -m "u:atomaton-tools:rwX" "${RUNNER_TEMP}/atomaton-run"
          sudo setfacl -R -d -m "u:atomaton-tools:rwX" "${RUNNER_TEMP}/atomaton-run"
          sudo setfacl -R -d -m "u:$(id -un):rwX" "${RUNNER_TEMP}/atomaton-run"

          # The agent's scratch workspace, on the same terms. The runner unpacks into it
          # before the agent starts and packs it up afterwards, and everything the agent does
          # in it happens as the tool user -- so both need to read and write what the other
          # creates, including files that do not exist yet.
          #
          # `/tmp` is already world-writable, so this is not what makes the directory
          # usable; it is what stops the two identities tripping over each other's file
          # modes inside it.
          # The machinery, read-only. It left the work tree, which is where it used to pick
          # up the tool user's access as a side effect of the recursive ACL below -- so
          # without this the tool servers cannot read their own scripts and no server starts.
          #
          # `rX` rather than `rwX`: read everywhere, execute only where execute is already
          # set for somebody. "Make tool hooks executable" ran earlier, so the hooks get it
          # and the ordinary files do not. Nothing here is the agent's to modify.
          sudo setfacl -R -m "u:atomaton-tools:rX" "$ATOMATON_MACHINERY_ROOT"

          # And the libraries the servers import, which sit beside the machinery for module
          # resolution to find. Read-only for the same reason.
          if [ -d "${RUNNER_TEMP}/node_modules" ]; then
            sudo setfacl -R -m "u:atomaton-tools:rX" "${RUNNER_TEMP}/node_modules"
          fi

          mkdir -p "/tmp/atomaton-workspace"
          sudo setfacl -R -m "u:atomaton-tools:rwX" "/tmp/atomaton-workspace"
          sudo setfacl -R -d -m "u:atomaton-tools:rwX" "/tmp/atomaton-workspace"
          sudo setfacl -R -d -m "u:$(id -un):rwX" "/tmp/atomaton-workspace"

          # And a directory for the credentials file that the TOOL USER owns, so atoma can
          # unlink it. Owned by them, writable by us: the runner writes the file into it and
          # hands it over, and the delete that keeps the file and the servers from coexisting
          # then succeeds. Without this the delete fails and every credential stays readable.
          sudo install -d -o "atomaton-tools" -m 0700 "$RUNNER_TEMP/atomaton-credentials"
          sudo setfacl -m "u:$(id -un):rwx" "$RUNNER_TEMP/atomaton-credentials"

          # Close the world-writable directories on PATH.
          #
          # The design rests on the tool user having no sudo. That is worth nothing while it
          # can write a directory the RUNNER's own later steps search: this job goes on to
          # run `git status`, `grep` and `gh issue comment` as the runner, which does have
          # passwordless sudo. Measured on ubuntu-latest: /opt/pipx_bin,
          # /usr/local/.ghcup/bin and /usr/local/bin are all drwxrwxrwx and all precede
          # /usr/bin.
          #
          # Computed from PATH rather than named, so an image that adds a fourth is covered.
          #
          # ORDER MATTERS, and this step is placed for it: every install this job performs
          # has to have happened already. The MCP packages, the environment setup -- and the
          # atoma CLI itself, which is written to /usr/local/bin. That last one is why this
          # step sits after "Install Atoma CLI": it did not, and the first real run failed
          # with
          #   curl: (23) Failure writing output to destination
          # because the directory curl was writing into had just been closed.
          for dir in ${PATH//:/ }; do
            [ -d "$dir" ] || continue
            case "$(stat -L -c '%A' "$dir" 2>/dev/null)" in
              *w?) sudo chmod go-w "$dir" && echo "closed world-writable PATH entry: $dir";;
            esac
          done

          # Git as the tool user, over a checkout the runner owns.
          #
          # `actions/checkout` writes this into the runner's own gitconfig, which the tool
          # user can read through the traversal granted above -- but that is a default of a
          # third-party action, and `github__commit_and_push` and every `git` the agent runs
          # depend on it. Said explicitly, at system level, so it does not.
          sudo git config --system --add safe.directory "$GITHUB_WORKSPACE" 2>/dev/null || true

          echo "tool servers will run as atomaton-tools (no sudo), caches in ${RUNNER_TEMP}/atomaton-tool-cache"
      - name: Resolve which repository secrets may reach this run
        id: secret-names
        shell: bash
        env:
          ATOMATON_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          DEFAULT_BRANCH="${ATOMATON_DEFAULT_BRANCH:-main}"
          TRUSTED_CONFIG="$RUNNER_TEMP/atomaton-declared-secrets.yaml"

          # Fetched into a ref this line owns, and read back from that same ref, so a
          # failed fetch has nothing to fall back to. Shallow: one commit of one branch is
          # all this needs. `+` so a re-run overwrites rather than refusing.
          if git fetch --quiet --depth=1 origin "+$DEFAULT_BRANCH:refs/atomaton/trusted-config" 2>/dev/null \
            && git show "refs/atomaton/trusted-config:.github/atomaton/config.yaml" > "$TRUSTED_CONFIG" 2>/dev/null; then
            echo "Read the credential declaration from ${DEFAULT_BRANCH}."
          else
            # Either the branch has no config.yaml or the fetch failed, and this cannot
            # tell which. It does not need to: both answers are "declare nothing", which is
            # the safe one. Naming both is the honest message -- asserting the first would
            # be asserting something this could not determine.
            echo '{}' > "$TRUSTED_CONFIG"
            echo "::warning::Could not read .github/atomaton/config.yaml from ${DEFAULT_BRANCH} (absent, or the fetch failed); this run reaches no declared credentials."
          fi

          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/read_secret_names.ts" --config "$RUNNER_TEMP/atomaton-declared-secrets.yaml"
      - name: Collect this run's credentials into a file
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ORCAROUTER_API_KEY: ${{ secrets.ORCAROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ATOMA_COPILOT_TOKEN: ${{ secrets.ATOMA_COPILOT_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          ATOMATON_SECRET_0: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[0]] }}
          ATOMATON_SECRET_1: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[1]] }}
          ATOMATON_SECRET_2: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[2]] }}
          ATOMATON_SECRET_3: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[3]] }}
          ATOMATON_SECRET_4: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[4]] }}
          ATOMATON_SECRET_5: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[5]] }}
          ATOMATON_SECRET_6: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[6]] }}
          ATOMATON_SECRET_7: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[7]] }}
          ATOMATON_SECRET_8: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[8]] }}
          ATOMATON_SECRET_9: ${{ secrets[fromJSON(steps.secret-names.outputs.names || '[]')[9]] }}
          ATOMATON_SECRET_NAMES: ${{ steps.secret-names.outputs.names }}
        run: |
          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/write_credentials_file.ts" --out "$RUNNER_TEMP/atomaton-credentials/credentials.json"
          # Handed to the user atoma runs as, which reads it and deletes it before starting
          # any server. Handed over rather than opened up: it holds every credential the run
          # supplies, and this step's own user keeps none of them afterwards.
          sudo chown atomaton-tools "$RUNNER_TEMP/atomaton-credentials/credentials.json"
      - name: Watch for a stop request
        if: steps.context.outputs.new_event_count != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.number }}
        run: |
          SINCE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          nohup bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/watch_for_stop.ts" --number "${NUMBER}" --stop-file "${RUNNER_TEMP}/atomaton-run/stop-requested" --since "${SINCE}" > "${RUNNER_TEMP}/atomaton-run/stop-watch.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/atomaton-run/stop-watch.pid"
          echo "watching #${NUMBER} for /stop since ${SINCE}"
      - name: Run agent
        id: atoma
        if: steps.context.outputs.new_event_count != '0'
        env:
          GITHUB_RUN_ID: ${{ github.run_id }}
          ISSUE_NUMBER: ${{ steps.fetch.outputs.resolved_number }}
          ATOMATON_RUN_TYPE: ${{ inputs.type }}
          ATOMATON_RELOAD_COUNT: ${{ inputs.reload_count }}
          ISSUE_NOTIFY: ${{ steps.notify.outputs.notify }}
          ATOMATON_OPS_LOG: ${{ runner.temp }}/atomaton-run/atomaton_ops.log
          OPENAI_BASE_URL_IN: ${{ vars.OPENAI_BASE_URL }}
          ATOMA_PROVIDER_IN: ${{ vars.ATOMA_PROVIDER }}
        shell: bash
        run: |
          AGENT="${{ inputs.agent }}"
          # Exported (not just a local shell var) so MCP tool-server subprocesses
          # spawned by `atoma run` below can read the current agent's name, e.g. to
          # tag artifacts they create (PRs, issues) with their origin agent.
          export AGENT

          # Exported because the invocation below passes each one explicitly to `env`, and a
          # step's `env:` block is present in the shell's environment already -- this makes
          # the dependency visible rather than implicit.
          export GITHUB_RUN_ID ISSUE_NUMBER ISSUE_NOTIFY ATOMATON_RUN_TYPE ATOMATON_OPS_LOG

          # The tools file is written now, from the config, rather than shipped. See
          # `scripts/write_tools_file.ts` for what shipping a generated file cost.
          #
          # From the MACHINERY config, which is the default branch's: a tools file names a
          # `command` for every server, so whoever writes it chooses what this run starts.
          # Generating from the pull request's own config would let a pull request decide its
          # own execution environment, which is the one rule none of this may cross.
          #
          # `--hook-base` is the machinery's `tools/` directory, because that is where the
          # hook scripts are. The output goes to the run directory and is thrown away with it.
          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/write_tools_file.ts" --config "${ATOMATON_MACHINERY_ROOT}/.github/atomaton/config.yaml" --defaults "${ATOMATON_MACHINERY_ROOT}/.github/atomaton-runtime/tools/defaults.yaml" --out "${RUNNER_TEMP}/atomaton-run/tools.yaml" --hook-base "${ATOMATON_MACHINERY_ROOT}/.github/atomaton-runtime/tools"
          TOOLS_ARG="--tools-file ${RUNNER_TEMP}/atomaton-run/tools.yaml"

          # Settings, not credentials. These two are repository VARIABLES -- which provider
          # to use and which host to reach -- so they belong in the environment; the
          # credentials do not, and are not here any more.
          #
          # Each is re-exported only when non-empty: exporting an empty ATOMA_PROVIDER would
          # defeat Atoma's provider auto-detection.
          for name in OPENAI_BASE_URL ATOMA_PROVIDER; do
            eval "value=\${${name}_IN:-}"
            if [ -n "$value" ]; then
              export "${name}=${value}"
            fi
          done

          # No --prompt-file or stdin is needed: the cached session contains both stable
          # GitHub context and the agent's chronological working history.
          # Run as the user the tool servers will inherit. Every server atoma starts is a
          # child of this process, so one `sudo -u` here is what puts all of them on that
          # user -- there is nothing per-server to configure or to forget.
          #
          # `env` in front rather than `--preserve-env`: the latter needs a sudoers
          # permission that a self-hosted runner may not grant, and both were measured, so
          # the portable one is used. Only what a server actually reads is passed; the
          # credentials are not here at all, they are in the file atoma deletes.
          #
          # HOME stays the runner's so the toolchain resolves. It is not writable by this
          # user, uniformly for every tool, and the caches are redirected below.
          # Built as an array so a setting that is EMPTY is not passed at all. `env NAME=`
          # sets the empty string, and atoma reads an empty base URL as a base URL -- which
          # would defeat the guard above and point every request at "/chat/completions".
          #
          # Adding a name here means adding it to `AGENT_ENV_NAMES` in
          # domain/delivery/declared-secrets.ts as well: a name the agent's process already means
          # something by is a name `tools.secrets` must not be able to mean something else
          # by. This is not an import -- the values below are shell and belong here -- so
          # tests/contract/agent-environment.test.ts is what holds the two together. It has
          # caught this drifting twice.
          AGENT_ENV=(
            HOME="$HOME"
            PATH="$PATH"
            AGENT="$AGENT"
            ATOMATON_MACHINERY_ROOT="$ATOMATON_MACHINERY_ROOT"
            GITHUB_REPOSITORY="$GITHUB_REPOSITORY"
            BRANCH="${BRANCH:-}"
            ISSUE_NUMBER="$ISSUE_NUMBER"
            ISSUE_NOTIFY="$ISSUE_NOTIFY"
            ATOMATON_RUN_TYPE="$ATOMATON_RUN_TYPE"
            ATOMATON_RELOAD_COUNT="$ATOMATON_RELOAD_COUNT"
            ATOMATON_OPS_LOG="$ATOMATON_OPS_LOG"
            # Caches, because $HOME is read-only to this user. CARGO_HOME is not a cache
            # directory -- redirecting it also hides ~/.cargo/config.toml -- but cargo has no
            # separate cache variable, and a project needing that config can commit
            # .cargo/config.toml, which cargo reads from the work tree.
            XDG_CACHE_HOME="${RUNNER_TEMP}/atomaton-tool-cache"
            XDG_CONFIG_HOME="${RUNNER_TEMP}/atomaton-tool-cache/config"
            XDG_DATA_HOME="${RUNNER_TEMP}/atomaton-tool-cache/data"
            BUN_INSTALL_CACHE_DIR="${RUNNER_TEMP}/atomaton-tool-cache/bun"
            npm_config_cache="${RUNNER_TEMP}/atomaton-tool-cache/npm"
            PIP_CACHE_DIR="${RUNNER_TEMP}/atomaton-tool-cache/pip"
            CARGO_HOME="${RUNNER_TEMP}/atomaton-tool-cache/cargo"
          )
          for name in OPENAI_BASE_URL ATOMA_PROVIDER; do
            eval "value=\${${name}:-}"
            if [ -n "$value" ]; then AGENT_ENV+=("${name}=${value}"); fi
          done

          # What is left of the job, handed to atoma as its own limit. See deadlineStep: the
          # agent stops itself with time to spare instead of being killed mid-call, which is
          # the difference between a session saved for the next run and one that never was.
          #
          # No iteration ceiling is passed at all. atoma stopped having a default one, and a
          # count of turns was never the thing that ran out: a turn that lists a directory
          # and a turn that compiles the project cost that counter the same.
          BUDGET=$(( ${{ steps.deadline.outputs.at }} - $(date +%s) ))
          if [ "$BUDGET" -lt 300 ]; then
            echo "::warning::only $BUDGET seconds of the job are left; giving the agent the 300-second floor"
            BUDGET=300
          fi
          echo "agent time budget: $BUDGET seconds"

          EXIT_CODE=0
          sudo -n -u "atomaton-tools" env "${AGENT_ENV[@]}" \
            atoma run \
            --agent-def "${ATOMATON_MACHINERY_ROOT}/.github/atomaton/agent-definitions/${AGENT}.md" \
            --in-session "${RUNNER_TEMP}/atomaton-run/session.json" \
            --out-session "${RUNNER_TEMP}/atomaton-run/session.json" \
            --template "${ATOMATON_MACHINERY_ROOT}/.github/atomaton/prompt-template.md" \
            --skills-dir "${ATOMATON_MACHINERY_ROOT}/.github/atomaton/skills" \
            --max-runtime-secs "$BUDGET" \
            --stop-file "${RUNNER_TEMP}/atomaton-run/stop-requested" \
            --credentials-file "$RUNNER_TEMP/atomaton-credentials/credentials.json" \
            ${TOOLS_ARG} \
            > "${RUNNER_TEMP}/atomaton-run/atomaton_output.txt" 2> "${RUNNER_TEMP}/atomaton-run/atomaton_logs.txt" || EXIT_CODE=$?

          echo "=== Atoma Logs ===" >&2
          cat "${RUNNER_TEMP}/atomaton-run/atomaton_logs.txt" >&2

          # The watcher has nothing left to watch for. Killed rather than left to the job,
          # because a poller that outlives the run it was polling for spends API budget on an
          # answer nobody will read.
          if [ -f "${RUNNER_TEMP}/atomaton-run/stop-watch.pid" ]; then
            kill "$(cat "${RUNNER_TEMP}/atomaton-run/stop-watch.pid")" 2>/dev/null || true
          fi

          # How the run ended, asked of the run. The core classifies its own ending and
          # writes it into the session it just saved; this reads that record. It used to be
          # guessed here -- status 2 and then a test for the stop file -- which collapsed two
          # different ceilings into one and raced the watcher that writes that file. See
          # read_run_ending.ts.
          #
          # A non-zero status that is not the soft stop is still a failure and still ends the
          # step, so nothing below it runs and no ending is published: the turn failed, and
          # decide_turn_ending.ts reads that from the step's own outcome.
          if [ "$EXIT_CODE" = "2" ] || [ "$EXIT_CODE" = "0" ]; then
            bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/read_run_ending.ts" --session "${RUNNER_TEMP}/atomaton-run/session.json" --exit-code "${EXIT_CODE}" --stop-file "${RUNNER_TEMP}/atomaton-run/stop-requested"
          elif [ "$EXIT_CODE" != "0" ]; then
            exit $EXIT_CODE
          fi

          # Store multiline result as a step output.
          # Use a random delimiter to prevent early termination if the agent
          # output happens to contain the delimiter string on its own line.
          RESULT_EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          {
            echo "result<<${RESULT_EOF}"
            cat "${RUNNER_TEMP}/atomaton-run/atomaton_output.txt"
            echo "${RESULT_EOF}"
          } >> "$GITHUB_OUTPUT"

          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/extract_directive.ts" --output-file "${RUNNER_TEMP}/atomaton-run/atomaton_output.txt" --def-dir "${ATOMATON_MACHINERY_ROOT}/.github/atomaton/agent-definitions"

          # Detect whether a tool call already triggered an automatic follow-up
          # dispatch during this run (atomaton__launch_sub_agent, github__create_pr ->
          # reviewer, github__merge_pr -> orchestrator-or-re-invoked-agent), as
          # opposed to the agent genuinely finishing with nothing further happening.
          # Every dispatch site writes a structured `{"op":"dispatch",...}` entry to
          # the ops log (see lib/ops-log.ts's logDispatch()) -- checking for that one
          # stable, documented JSON field is far more robust than the previous
          # approach (grepping the agent's raw stderr TEXT for hand-written
          # strings like "dispatched: agent=..."), which silently broke once already
          # when a refactor changed a log message's wording without updating the grep
          # pattern to match.
          CHAIN_CONTINUES=false
          if [ -f "${RUNNER_TEMP}/atomaton-run/atomaton_ops.log" ] && grep -q '"op":"dispatch"' "${RUNNER_TEMP}/atomaton-run/atomaton_ops.log"; then
            CHAIN_CONTINUES=true
          fi
          echo "chain_continues=${CHAIN_CONTINUES}" >> "$GITHUB_OUTPUT"

          # Whether this run changed anything, read from the same log and for a related
          # reason: domain/work/progress.ts stops a chain that is not getting anywhere, and the
          # most direct signal of that is a run that pushed nothing.
          #
          # Three ops count as progress. A commit is the obvious one; opening a pull request
          # and merging one both move the work along without necessarily pushing during THIS
          # run, and reading either as "changed nothing" would stop a chain at the moment it
          # was working.
          CHANGED=false
          if [ -f "${RUNNER_TEMP}/atomaton-run/atomaton_ops.log" ] && grep -qE '"op":"(commit_and_push|create_pr|merge_pr)"' "${RUNNER_TEMP}/atomaton-run/atomaton_ops.log"; then
            CHANGED=true
          fi
          echo "changed=${CHANGED}" >> "$GITHUB_OUTPUT"
      - name: Write token usage summary
        if: always()
        shell: bash
        run: |
          USAGE_LINE=$(grep -m1 "ATOMA_TOKEN_USAGE:" "${RUNNER_TEMP}/atomaton-run/atomaton_logs.txt" 2>/dev/null || true)
          if [ -z "$USAGE_LINE" ]; then
            exit 0
          fi
          PROMPT=$(echo "$USAGE_LINE"     | grep -oP 'prompt=\K[0-9]+' || true)
          COMPLETION=$(echo "$USAGE_LINE" | grep -oP 'completion=\K[0-9]+' || true)
          TOTAL=$(echo "$USAGE_LINE"      | grep -oP 'total=\K[0-9]+' || true)
          # Atoma prints cached=unknown when no inference reported one; the digits-only
          # pattern leaves CACHED empty there, and the cell reads — rather than 0. Zero is a
          # claim that the cache did nothing, which is not what an absent measurement says.
          CACHED=$(echo "$USAGE_LINE"     | grep -oP 'cached=\K[0-9]+' || true)
          {
            echo "## Atoma Token Usage"
            echo "| Agent | Prompt | Cached | Completion | Total |"
            echo "|------------|--------|--------|------------|-------|"
            echo "| ${{ inputs.agent }} | ${PROMPT:-—} | ${CACHED:-—} | ${COMPLETION:-—} | ${TOTAL:-—} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Post result comment
        id: post-result
        if: steps.atoma.outcome == 'success' && steps.context.outputs.new_event_count != '0'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/post_result_comment.ts" --number "${{ inputs.number }}" --agent "${{ inputs.agent }}" --type "${{ inputs.type }}" --notify "${{ steps.notify.outputs.notify }}" --directive "${{ steps.atoma.outputs.directive }}" --chain-continues "${{ steps.atoma.outputs.chain_continues }}" --ended-because "${{ steps.atoma.outputs.ended_because }}" --messages-before "${{ steps.context.outputs.messages_before }}" --changed "${{ steps.atoma.outputs.changed }}" --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" --session "${RUNNER_TEMP}/atomaton-run/session.json" --output "${RUNNER_TEMP}/atomaton-run/atomaton_output.txt" --logs-file "${RUNNER_TEMP}/atomaton-run/atomaton_logs.txt"
      - name: Record run metadata
        if: steps.atoma.outcome == 'success' && steps.post-result.outputs.comment_id != ''
        shell: bash
        run: |
          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/record_run_metadata.ts" --session "${RUNNER_TEMP}/atomaton-run/session.json" --comment-id "${{ steps.post-result.outputs.comment_id }}" --agent "${{ inputs.agent }}" --snapshot-hash "${{ steps.context.outputs.context_snapshot_hash }}" --event-count "${{ steps.context.outputs.context_event_count }}" --type "${{ steps.fetch.outputs.resolved_type }}" --resolved-number "${{ steps.fetch.outputs.resolved_number }}"
      - name: Save session to atomaton-data branch
        if: always() && steps.atoma.outcome != 'skipped'
        shell: bash
        run: |
          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/save_agent_session.ts" --session "${RUNNER_TEMP}/atomaton-run/session.json" --type "${{ steps.fetch.outputs.resolved_type }}" --number "${{ steps.fetch.outputs.resolved_number }}" --agent "${{ inputs.agent }}"
      - name: Save the agent's workspace
        if: steps.atoma.outcome == 'success'
        shell: bash
        run: |
          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/save_workspace.ts" --root-issue "${{ steps.workspace.outputs.root_issue }}" --source "/tmp/atomaton-workspace" --agent "${{ inputs.agent }}"
      - name: Write the metrics report
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/write_metrics_report.ts"
      - name: Report failure
        if: always() && job.status != 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.number }}
          AGENT: ${{ inputs.agent }}
          NOTIFY: ${{ steps.notify.outputs.notify }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/report_run_failure.ts" --number "${NUMBER}" --agent "${AGENT}" --notify "${NOTIFY}" --run-url "${RUN_URL}" --logs-file "${RUNNER_TEMP}/atomaton-run/atomaton_logs.txt"
      - name: Check for uncommitted changes
        id: dirty
        if: steps.atoma.outcome == 'success'
        shell: bash
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Inject uncommitted changes into session
        if: steps.dirty.outputs.has_changes == 'true'
        shell: bash
        run: |
          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/inject_uncommitted_notice.ts" --session "${RUNNER_TEMP}/atomaton-run/session.json"
      - name: Notify that the run reached its limit
        if: steps.atoma.outputs.ended_because == 'runtime' || steps.atoma.outputs.ended_because == 'iterations'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.number }}
          NOTIFY: ${{ steps.notify.outputs.notify }}
          AGENT: ${{ inputs.agent }}
        run: |
          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/notify_limit_reached.ts" --number "${NUMBER}" --agent "${AGENT}" --notify "${NOTIFY}" --session "${RUNNER_TEMP}/atomaton-run/session.json"
      - name: Manage auto-dispatch loop control
        id: loop-control
        if: steps.atoma.outcome == 'success'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/manage_dispatch_loop.ts" --number "${{ inputs.number }}"
      - name: Decide how this turn ended
        id: turn-ending
        if: always()
        shell: bash
        run: |
          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/decide_turn_ending.ts" --outcome "${{ steps.atoma.outcome }}" --ended-because "${{ steps.atoma.outputs.ended_because }}" --loop-limit-reached "${{ steps.loop-control.outputs.loop_limit_reached }}" --chain-continues "${{ steps.atoma.outputs.chain_continues }}" --directive "${{ steps.atoma.outputs.directive }}"
      - name: Remove atomaton/in-progress label on completion
        if: always() && steps.turn-ending.outputs.should_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.number }}
        run: |
          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/manage_in_progress_label.ts" --action "remove" --number "${NUMBER}"
      - name: Dispatch next agent
        if: steps.turn-ending.outputs.dispatch_to != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ATOMATON_OPS_LOG: ${{ runner.temp }}/atomaton-run/atomaton_ops.log
          DIRECTIVE: ${{ steps.turn-ending.outputs.dispatch_to }}
          NUMBER: ${{ inputs.number }}
          TYPE: ${{ inputs.type }}
          NOTIFY: ${{ steps.notify.outputs.notify }}
        run: |
          bun run "${ATOMATON_MACHINERY_ROOT:-.}/.github/atomaton-runtime/scripts/dispatch_agent.ts" --agent "${DIRECTIVE}" --number "${NUMBER}" --type "${TYPE}" --notify "${NOTIFY}" --context "the agent on ${TYPE} #${NUMBER} handed off to ${DIRECTIVE}"
      - name: Comment on loop limit reached
        if: steps.turn-ending.outputs.chain_over_to != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          NUMBER: ${{ inputs.number }}
          DIRECTIVE: ${{ steps.turn-ending.outputs.chain_over_to }}
          NOTIFY: ${{ steps.notify.outputs.notify }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REASON: ${{ steps.loop-control.outputs.stop_reason }}
        run: |
          if [ -n "$NUMBER" ]; then
            MENTION=""
            if [ -n "$NOTIFY" ]; then
              MENTION="@${NOTIFY} - "
            fi
            BD=$(mktemp)
            # Out of the model's context, like the other operational notices: it names a
            # person and tells them how to resume.
            printf '%s
          ' "<!-- atomaton:llm-context=exclude -->" > "$BD"
            echo "${MENTION}${REASON}" >> "$BD"
            echo "The next agent would have been ${DIRECTIVE}." >> "$BD"
            echo "Please review the progress so far. To resume, post a manual comment on the Issue/PR (e.g. /${DIRECTIVE}) to trigger the next agent at any time." >> "$BD"
            echo "See the workflow run for details: ${RUN_URL}." >> "$BD"
            gh issue comment "$NUMBER" --body-file "$BD"
            rm -f "$BD"
          fi
