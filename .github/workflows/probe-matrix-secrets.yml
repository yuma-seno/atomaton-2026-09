# Throwaway. Answers one question and is deleted.
#
# Can a matrix entry decide which repository secret reaches its own job? The check
# workflow already indexes `secrets` by a value computed at run time, but with a
# fixed list for the whole job. A per-job secret list is what would let a project
# declare several check jobs — one running the default branch's commands with
# credentials, one running the pull request's with none — without writing a
# workflow, which an agent cannot do.
#
# Prints presence, never a value. `SELF_DEPLOY_TOKEN` is not referenced here.
name: Probe matrix secrets
'on':
  pull_request:
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      jobs: ${{ steps.plan.outputs.jobs }}
    steps:
      - name: Stand in for reading config.yaml
        id: plan
        shell: bash
        run: |
          printf 'jobs=%s\n' '[{"name":"with-a-real-name","secret_names":["OPENROUTER_API_KEY"]},{"name":"with-a-name-that-does-not-exist","secret_names":["ATOMATON_NO_SUCH_SECRET"]},{"name":"with-no-names","secret_names":[]}]' >> "$GITHUB_OUTPUT"

  probe:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.jobs) }}
    name: ${{ matrix.name }}
    steps:
      - name: Say whether the secret this entry named arrived
        shell: bash
        env:
          SLOT_0: ${{ secrets[matrix.secret_names[0]] }}
        run: |
          if [ -n "${SLOT_0:-}" ]; then
            echo "PROBE ${{ matrix.name }}: a value arrived"
          else
            echo "PROBE ${{ matrix.name }}: nothing arrived"
          fi
