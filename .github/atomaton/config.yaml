# Everything this project declares, in one file.
#
# Every setting is explained in docs/configuration.md, including the measurements
# behind the numbers. The comments here name what a key is; that file says why.
#
#   https://github.com/yuma-seno/atomaton/blob/main/docs/configuration.md
#
# Grouped by who consumes the value. Nothing here says where a file lives --
# .github/atomaton/README.md has that, and why.
#
# The first five sections are yours. `tools` is the machinery's own.


# Where work branches from and merges back to. Empty = the default branch.
base_branch: ""


# Run before checks, before deployments, and before an agent starts.
environment:
  setup_commands:
    - "bun install --frozen-lockfile"
  # Rebuilds of the environment one piece of work may ask for. The refusal goes
  # to the agent, which carries on -- unlike the counters under `chain`.
  max_reloads: 3


# How a change is verified. Either let Atomaton run your checks, or name
# `your_workflow` instead. Both is a configuration error.
checks:
  # The commands this pull request declares, run in this pull request's own tree.
  # No repository secret reaches them: a pull request may rewrite any command here,
  # so a credential would be one the change being judged can read.
  from_pull_request:
    # One job, because these run in order and each needs what the one before it
    # built: `synth` writes what `test` reads. Splitting them would mean building
    # the tree again in every job to save nothing.
    - name: verify
      commands:
        # The SOURCE, not the deployed copy. This repository builds the deliverable,
        # so `.github/` here is the last release and lags every change by a deploy.
        # A pull request that moves a script would otherwise fail its own check for
        # naming a path that is correct and not yet deployed. An adopter has no such
        # gap -- their tree is one release, whole -- so the shipped default in
        # src/atomaton/config.yaml names the deployed path and this one does not.
        - "bun run src/scripts/scan_secrets.ts"
        - "bun run typecheck"
        - "bun run synth"
        - "bun run test"

  # Nothing here needs a credential yet. A check that did would go here, with the
  # commands read from the default branch and the pull request handed over as a path.
  from_default_branch: []

  # your_workflow: ci.yml


# How a merged change ships. One list per event that ships it.
deploy:
  # Lands on the default branch, so `branches` is left out — that is what naming
  # none means. `on_tag` and `on_demand` are absent rather than empty: this
  # repository ships one thing, and an empty list would read as one it forgot.
  on_merge:
    - name: release
      commands:
        - "./scripts/release.sh"

  # TEMPORARY, for #872. A deployment that creates a tag, and a deployment that
  # answers to it — the pair that proves a machine-made tag reaches `on_tag`,
  # which no `push` event ever announces. Removed once the run has been read.
  on_demand:
    - name: tag-probe
      commands:
        - 'gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/probe-872" -f sha="$GITHUB_SHA"'
  on_tag:
    - name: probe-arrived
      tags: ["probe-*"]
      commands:
        - 'echo "on_tag ran for $GITHUB_REF as $ATOMATON_DEPLOY_TARGET"'
  # your_workflow: cd.yml


# When a person, not an agent, performs the merge. Any one of these firing is
# enough.
merge:
  policy: auto              # this repository lets agents merge
  governed_paths:             # changes here are a person's to merge
    - ".github/**"
    - "scripts/**"
  gates:
    - reason: "This changes the code that decides what an agent may merge. Read it before merging: a weakening here would not be caught anywhere later."
      when:
        files_changed:
          - "src/domain/merge-readiness.ts"
          - "src/domain/merge-gates.ts"
          - "src/domain/path-patterns.ts"
          - "src/lib/merge-signals.ts"


# When a chain of runs stops and asks a person.
chain:
  after_handoffs: 5                 # handoffs with nobody else commenting
  after_runs_without_change: 2      # runs that pushed, opened and merged nothing
  # State one run leaves for the next. Change only on a name collision.
  labels:
    in_progress: atomaton/in-progress
    sub_issue: atomaton/sub-issue
    launched: atomaton/launched


# What an agent can reach, and under what watch.
#
# The machinery's own configuration. This project owns the runtime it uses, so it
# is declared here rather than in a second file; the generator writes the part the
# core reads. Most projects never edit past this line.
tools:
  # Repository secrets the servers may reach. Separate from the ones a check or a
  # deployment names on its own entry: only these enter an agent's own environment.
  secrets: []

  # Your own tool servers, and overrides of the ones Atomaton ships.
  #
  # A name Atomaton does not ship is added. A name it does ship is overridden field by
  # field, so raising one timeout does not mean copying an argv. The shipped set is
  # listed in .github/atomaton/README.md and in docs/configuration.md; it is not here
  # because deleting one breaks a run, and an agent only starts the servers its own
  # `mcp_servers` names.
  servers: {}

  # Your own hooks, run after Atomaton's on every call to every server.
  # Added to what Atomaton watches, never replacing it.
  watch: {}
