# Everything this project declares, in one file.
#
# Every setting is explained in docs/configuration.md, including the measurements
# behind the numbers. The comments here name what a key is; that file says why.
#
#   https://github.com/yuma-seno/atomaton/blob/main/docs/configuration.md
#
# Grouped by who consumes the value. Nothing here says where a file lives --
# .github/atoma/README.md has that, and why.
#
# The first five sections are yours. `tools` is the machinery's own.


# Where work branches from and merges back to. Empty = the default branch.
base_branch: ""


# Run before checks, before deployments, and before an agent starts.
environment:
  setup_commands: []
  # Rebuilds of the environment one piece of work may ask for. The refusal goes
  # to the agent, which carries on -- unlike the counters under `chain`.
  max_reloads: 3


# How a change is verified. Exactly one arm: fill in `atoma_runs`, or name
# `your_workflow` instead. Both is a configuration error.
checks:
  atoma_runs:
    # In order, stopping at the first failure.
    commands:
      - bun run "${ATOMA_MACHINERY_ROOT:-.}/.github/scripts/scan_secrets.ts"
    # Repository secrets this step may reach, by name.
    secrets: []
    runs_on: ubuntu-latest
  # your_workflow: ci.yml


# How a merged change ships. The same two arms.
deploy:
  atoma_runs:
    # Each names an environment, when it ships, and the commands that ship it.
    targets: []
    secrets: []
    runs_on: ubuntu-latest
  # your_workflow: cd.yml


# When a person, not an agent, performs the merge. Any one of these firing is
# enough.
merge:
  policy: manual              # manual = an agent never merges
  governed_paths:             # changes here are a person's to merge
    - ".github/**"
  gates: []                   # conditional escalations, each with its reason


# When a chain of runs stops and asks a person.
chain:
  after_handoffs: 5                 # handoffs with nobody else commenting
  after_runs_without_change: 2      # runs that pushed, opened and merged nothing
  # State one run leaves for the next. Change only on a name collision.
  labels:
    in_progress: atoma/in-progress
    sub_issue: atoma/sub-issue
    launched: atoma/launched


# What an agent can reach, and under what watch.
#
# The machinery's own configuration. This project owns the runtime it uses, so it
# is declared here rather than in a second file; the generator writes the part the
# core reads. Most projects never edit past this line.
tools:
  # Repository secrets the servers may reach. Separate from `checks.secrets` and
  # `deploy.secrets` because only these enter an agent's own environment.
  secrets: []

  # Applies to every server, before each server's own.
  watch:
    after_tool: ./scripts/hooks/workspace_guard.ts

  servers:
    filesystem:
      command: mcp-server-filesystem
      args: ["."]
      env: {}
      hooks:
        tool_denylist:
          - "filesystem__directory_tree"
        # Clears the search streak, which shell_guard can only see shell opens for.
        after_tool: ./scripts/hooks/note_file_opened.ts

    filesystem_readonly:
      command: mcp-server-filesystem
      args: ["."]
      env: {}
      hooks:
        tool_allowlist:
          - "filesystem_readonly__read_file"
          - "filesystem_readonly__read_multiple_files"
          - "filesystem_readonly__read_media_file"
          - "filesystem_readonly__list_directory"
          - "filesystem_readonly__get_file_info"
        after_tool: ./scripts/hooks/note_file_opened.ts

    shell:
      command: bun
      args: ["run", "${ATOMA_MACHINERY_ROOT:-.}/.github/atoma/tools/scripts/mcp/shell.ts"]
      env: {}
      request_timeout_secs: 3600
      hooks:
        before_tool: ./scripts/hooks/shell_guard.ts

    github:
      command: bun
      args: ["run", "${ATOMA_MACHINERY_ROOT:-.}/.github/atoma/tools/scripts/mcp/github.ts"]
      env:
        GH_TOKEN: "${GH_TOKEN}"
      hooks: {}

    web:
      command: bun
      args: ["run", "${ATOMA_MACHINERY_ROOT:-.}/.github/atoma/tools/scripts/mcp/web.ts"]
      env: {}
      hooks: {}

    search:
      command: bun
      args: ["run", "${ATOMA_MACHINERY_ROOT:-.}/.github/atoma/tools/scripts/mcp/search.ts"]
      env:
        GH_TOKEN: "${GH_TOKEN}"
      request_timeout_secs: 300
      hooks: {}
      # Read by the server itself, not by the core. `settings` is the one key this
      # project reserves inside a server entry; the generator strips it.
      settings:
        reranker_model: onnx-community/bge-reranker-v2-m3-ONNX

    atoma:
      command: bun
      args: ["run", "${ATOMA_MACHINERY_ROOT:-.}/.github/atoma/tools/scripts/mcp/atoma.ts"]
      env:
        GH_TOKEN: "${GH_TOKEN}"
      hooks: {}

    atoma_env:
      command: bun
      args: ["run", "${ATOMA_MACHINERY_ROOT:-.}/.github/atoma/tools/scripts/mcp/atoma.ts"]
      env:
        GH_TOKEN: "${GH_TOKEN}"
      hooks:
        tool_allowlist:
          - "atoma_env__reload_environment"
